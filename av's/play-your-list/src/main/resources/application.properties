spring.application.name=play-your-list
server.port=8080

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:playyourlist
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL utilizada pelos clientes OpenFeign. Neste exercicio, todos os endpoints
# estao na mesma aplicacao, conforme solicitado pelo professor.
app.base-url=http://localhost:${server.port}

logging.level.br.com.playyourlist=INFO
